[package]
name = "bias-core"
version = "1.0.0"
edition = "2021"
authors = [
  "Sam L. Thomas <sam@binarly.io>",
  "Francesco Evangelista <francesco@binarly.io>",
  "Yegor Vasilenko <yegor@binarly.io>",
  "Fabio Pagani <fabio@binarly.io>",
  "Fernando Mercês <fernando@binarly.io>",
  "Anton Ivanov <anton@binarly.io>",
  "Lukas Seidel <lukas@binarly.io>",
  "Claudiu-Vlad Ursache <claudiuv@binarly.io>",
  "Chris McMahon Stone <chris@binarly.io>",
]
description = "Binarly Analysis and Inspection System (BIAS)"
repository = "https://github.com/vulhunt-re/vulhunt"
license = "MIT OR Apache-2.0"
readme = "../README.BIAS.md"

[features]
default = []
decompiler = ["dep:cmake", "dep:convert_case", "dep:cxx", "dep:cxx-build", "dep:ordered-float", "dep:quick-xml", "dep:replace_with", "dep:tree-sitter", "dep:weggli", "dep:which"]
import-c = ["dep:clang", "dep:walkdir"]

[dependencies]
ahash = { version = "0.8", features = ["compile-time-rng", "serde"] }
arrayvec = "0.7"
base32 = "0.5"
bias-core-derive = { version = "1.0", path = "../bias-core-derive" }
bias-loader-uefi = "1"
bitflags = "2"
clang = { version = "2", features = ["clang_8_0", "runtime"], optional = true }
compact_str = "0.8.0"
crepe = "0.1"
downcast-rs = "1.2"
dyn-clone = "1"
educe = "0.6"
egg = "0.11"
encode_unicode = "1"
fixedbitset = { version = "0.4", features = ["serde"] }
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
fst = "0.4"
fuguex-state = "0.2"
gazebo = "0.8"
gimli = "0.28"
goblin = { version = "0.4", package = "bias-goblin" }
indexmap = { version = "2.2", features = ["serde"] }
iset = { version = "0.3", features = ["serde"] }
itertools = "0.12"
tracing = "0.1"
lzma-rs = "0.3"
memmap2 = "0.9"
once_cell = "1"
ouroboros = "0.18"
pdb = "0.8"
petgraph = { version = "0.6", features = ["serde-1"] }
postcard = { version = "1", features = ["use-std"] }
range-set-blaze = "0.1"
regex = "1"
rmp-serde = "1.3"
roaring = "0.11"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
shared_arena = { version = "0.8", package = "bias-shared-arena" }
slab = { version = "0.4.5", features = ["serde"] }
smallvec = { version = "1.10", features = ["serde"] }
thiserror = "1"
ustr = { version = "0.9", features = ["serialization"] }
uuid = { version = "1.1", features = ["serde", "v4"] }
walkdir = { version = "2", optional = true }
yaxpeax-arch = { version = "0.3", default-features = false }
yaxpeax-arm = "0.3"
yaxpeax-x86 = "2.0"
zstd = "0.13"

# Optional dependencies for decompiler feature
convert_case = { version = "0.6", optional = true }
cxx = { version = "1", optional = true }
ordered-float = { version = "4", optional = true }
quick-xml = { version = "0.31", features = ["serialize"], optional = true }
replace_with = { version = "0.1", optional = true }
tree-sitter = { version = "0.25", optional = true }
weggli = { version = "0.2", package = "wegglix", optional = true }
which = { version = "8", optional = true }

[target.'cfg(windows)'.dependencies]
fugue = { version = "0.2", features = ["bigint-malachite"], default-features = false }

[target.'cfg(not(windows))'.dependencies]
fugue = { version = "0.2", features = ["bigint-rug"], default-features = false }

[build-dependencies]
cmake = { version = "0.1", optional = true }
cxx-build = { version = "1", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"

[lints]
workspace = true
