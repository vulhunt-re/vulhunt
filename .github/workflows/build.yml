name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-latest

    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Install cargo-make
        run: cargo install cargo-make

      - name: Install system deps (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          CODENAME=$(lsb_release -cs)
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 cmake libgmp-dev libmpfr-dev

      - name: Install system deps (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: brew install -q llvm@19 cmake gmp mpfr

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@a7a1a882e2d06ebe05d5bb97c3e1f8c984ae96fc
        with:
          version: "19"

      - name: Set CC/CXX (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang++-19" >> "$GITHUB_ENV"

      - name: Set CC/CXX (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@19)"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion)" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $env:GITHUB_ENV

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$") {
              echo "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Build and prepare bundle
        env:
          VULHUNT_VERSION: ${{ steps.version.outputs.version }}
        run: cargo make --profile=release prepare-bundle

      - name: Upload bundle zip
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vulhunt-ce-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: target/vulhunt-ce-*.zip

      - name: Clean up LLVM before cache
        shell: bash
        run: rm -rf target/llvm

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes \
            vulhunt-ce-*.zip
