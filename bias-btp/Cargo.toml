[package]
name = "bias-btp"
version = "1.0.0"
edition = "2024"
authors = [
  "Sam L. Thomas <sam@binarly.io>",
  "Francesco Evangelista <francesco@binarly.io>",
  "Yegor Vasilenko <yegor@binarly.io>",
  "Fabio Pagani <fabio@binarly.io>",
  "Fernando Mercês <fernando@binarly.io>",
  "Anton Ivanov <anton@binarly.io>",
  "Lukas Seidel <lukas@binarly.io>",
  "Claudiu-Vlad Ursache <claudiuv@binarly.io>",
  "Chris McMahon Stone <chris@binarly.io>",
]

[dependencies]
astral-tokio-tar = "0.5"
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
oci-client = "0.16"
reqwest = { version = "0.13", features = ["form", "json", "multipart", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
url = "2"

[dev-dependencies]
dotenvy = "0.15"
tracing-subscriber = "0.3"

[lints]
workspace = true
